name: Seznam IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seznam-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and submit sitemap URLs
        env:
          SITE_URL: https://www.smlouvahned.cz
          INDEXNOW_KEY: b389f1acf502dcba7f34acac367de3e8
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const site = process.env.SITE_URL.replace(/\/+$/, '');
          const key = process.env.INDEXNOW_KEY;
          const keyUrl = `${site}/${key}.txt`;
          const expectedCommit = (process.env.EXPECTED_COMMIT || '').trim();
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          // Čekat na NASAZENÍ TOHOTO commitu, ne jen na to, že web odpovídá.
          // Dřív se tu čekalo na klíčový soubor IndexNow — jenže ten je
          // napříč deploymenty identický a je živý už z předchozího buildu,
          // takže kontrola prošla okamžitě a odeslala starou sitemapu.
          // 2026-09-11 se tím minula jediná URL, na které záleželo.
          let deployedCommit = null;
          for (let attempt = 1; attempt <= 90; attempt += 1) {
            try {
              const response = await fetch(`${site}/api/version`, {
                cache: 'no-store',
                headers: { 'user-agent': 'SmlouvaHned-IndexNow/1.0' },
              });
              if (response.ok) {
                const payload = await response.json();
                deployedCommit = payload && payload.commit;
                if (!expectedCommit || deployedCommit === expectedCommit) break;
              }
            } catch {
              // Production deployment may still be propagating.
            }
            deployedCommit = null;
            await sleep(5000);
          }

          if (expectedCommit && deployedCommit !== expectedCommit) {
            throw new Error(
              `Production still serves ${deployedCommit ?? 'an unknown commit'}, expected ${expectedCommit}. ` +
              'Refusing to submit a stale sitemap.',
            );
          }
          console.log(`Production is serving ${deployedCommit ?? '(commit unknown)'}.`);

          // Klíč musí být dostupný, jinak Seznam odeslání odmítne.
          const keyResponse = await fetch(keyUrl, {
            cache: 'no-store',
            headers: { 'user-agent': 'SmlouvaHned-IndexNow/1.0' },
          });
          if (!keyResponse.ok || (await keyResponse.text()).trim() !== key) {
            throw new Error(`IndexNow key is not available at ${keyUrl}`);
          }

          const sitemapUrl = `${site}/sitemap.xml`;
          const sitemapResponse = await fetch(sitemapUrl, {
            cache: 'no-store',
            headers: { 'user-agent': 'SmlouvaHned-IndexNow/1.0' },
          });
          if (!sitemapResponse.ok) {
            throw new Error(`Unable to fetch sitemap: ${sitemapResponse.status} ${sitemapResponse.statusText}`);
          }

          const xml = await sitemapResponse.text();
          const siteHost = new URL(site).hostname;
          const urls = [...new Set(
            [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)]
              .map((match) => match[1].trim())
              .filter((url) => {
                try {
                  return new URL(url).hostname === siteHost;
                } catch {
                  return false;
                }
              }),
          )];

          if (urls.length === 0) {
            throw new Error('No indexable page URLs found in sitemap.xml');
          }
          if (urls.length > 10000) {
            throw new Error(`Sitemap contains ${urls.length} URLs; IndexNow allows at most 10,000 URLs per request.`);
          }

          const indexNowResponse = await fetch('https://search.seznam.cz/indexnow', {
            method: 'POST',
            headers: {
              'content-type': 'application/json; charset=utf-8',
              'user-agent': 'SmlouvaHned-IndexNow/1.0',
            },
            body: JSON.stringify({
              host: new URL(site).host,
              key,
              keyLocation: keyUrl,
              urlList: urls,
            }),
          });
          const responseBody = await indexNowResponse.text();

          console.log(`Seznam IndexNow response: ${indexNowResponse.status} ${indexNowResponse.statusText}`);
          console.log(`Submitted ${urls.length} unique sitemap URLs from ${sitemapUrl}`);
          if (responseBody) console.log(responseBody);

          if (!indexNowResponse.ok) {
            throw new Error(`Seznam IndexNow rejected submission: ${indexNowResponse.status} ${responseBody}`);
          }
          NODE
