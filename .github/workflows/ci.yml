name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Audit the production supply chain (what actually ships). Dev-only lint
      # tooling is excluded because its advisories never reach the browser bundle.
      - run: npm ci
      - run: npm audit --audit-level=moderate --omit=dev
      # Full suite runs once on the final PR SHA. Acceptance preview and the
      # subsequent fast-forward production release reuse that exact SHA.
      - run: npm run test:pre-deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
