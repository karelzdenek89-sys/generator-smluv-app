name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Audit the production supply chain (what actually ships). Dev-only lint
      # tooling (eslint/brace-expansion) is excluded — its advisories never reach
      # the browser bundle and would otherwise block deploys on upstream churn.
      - run: npm audit --audit-level=moderate --omit=dev
      - run: npm run test:pre-deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
